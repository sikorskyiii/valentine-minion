<!doctype html>
<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap&subset=cyrillic" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont,
                "Segoe UI", Arial, Helvetica, sans-serif;
        }

        img {
            width: 300px;
            height: auto;
            margin-top: 150px;
        }


        button {
            -webkit-appearance: none;
            appearance: none;

            background: #e6e6e6;
            border: 1px solid #999;
            border-radius: 0;

            color: #000;
            font-size: 24px;
            padding: 16px 32px;
            margin: 0 10px;

            font-family: inherit;
        }

        #left {
            transform-origin: top center;
        }


        #ui {
            transform: scale(1.5);
        }
    </style>
</head>

<body>

    <table id="ui" width="100%" height="100%">
        <tr>
            <td align="center" valign="middle">

                <!-- GIF -->
                <img id="gif" src="minion-minion-loves.gif" alt="photo"><br><br>

                <!-- Text -->
                <div id="text">Ти будеш моє валентинкою?</div><br>

                <!-- Buttons -->
                <button id="left">ТАК</button>
                <button id="right">НІ</button>

            </td>
        </tr>
    </table>

    <script>
        const left = document.getElementById("left");
        const right = document.getElementById("right");
        const gif = document.getElementById("gif");
        const text = document.getElementById("text");

        let clicks = 0;

        const scales = [
            [1.6, 1.6],
            [2.2, 2.4],
            [3.0, 3.4],
            [4.2, 5.4],
            [6.7, 8.0]
        ];

        const texts = [
            "Впевнена?",
            "Впевнена? \nТочно впевнена?",
            "Краще Вибери ТАААААК",
            "Кохана Будь лааааааааска",
            "НАТИСНИ ТАК БУДЬ ЛАААААСКААААААААА"
        ];

        right.onclick = () => {
            if (clicks < texts.length) {
                right.innerText = texts[clicks];

                const s = scales[clicks];
                left.style.transform = "scale(" + s[0] + "," + s[1] + ")";
                left.style.position = "relative";
                left.style.zIndex = 9999;

                clicks++;
            }
        };

        left.onclick = () => {
            gif.src = "fireworks-exploding-heart.gif";
            text.innerText = "УРААААААААА!!!КОХАЮ ТЕБЕ!!!!!";

            left.style.display = "none";
            right.style.display = "none";
        };
    </script>

</body>

</html>
